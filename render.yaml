services:
  - type: web
    name: beyond-disability
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beyond-disability-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_MONTHLY_TOTAL_COUNT
        value: "120"
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: ADMIN_OTP_EMAIL
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_USER_TEMPLATE_ID
        sync: false
      - key: EMAILJS_ADMIN_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PASSWORD_RESET_TEMPLATE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

databases:
  - name: beyond-disability-db
    plan: free
    databaseName: beyond_disability
    user: beyond_admin
